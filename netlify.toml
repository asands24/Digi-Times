[build]
  publish = "build"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # Note: REACT_APP_SUPABASE_ANON_KEY is intentionally public (it's the Supabase anon/public key)
  # Vite emits external module scripts, compatible with script-src 'self'.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Vite emits external scripts compatible with script-src 'self'.
    # connect-src: explicit Supabase REST/Storage/Auth (https) + Realtime (wss); 'self' covers the
    #   same-origin Netlify function at /.netlify/functions/generateStory.
    # style-src still needs 'unsafe-inline' (React components use inline styles).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' https: data:; connect-src 'self' https://irxpqhxrylaxfdppnwra.supabase.co wss://irxpqhxrylaxfdppnwra.supabase.co; worker-src 'self' blob:;"

[[edge_functions]]
  path = "/s/*"
  function = "share-meta"
